    <style>
      @layer base {
        html, body {
          width: 100vw;
          margin: 0;
          padding: 0;
          background-color: #f4ece2;
          color: #26140f;
        }
        html[lang="ar"], html[lang="ar"] body, [dir="rtl"] {
          font-family: 'Cairo', sans-serif !important;
        }
        html[lang="en"], html[lang="en"] body, [dir="ltr"] {
          font-family: 'Edu QLD Hand', 'Edu QLD Beginner', cursive, sans-serif !important;
        }
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Antique Gilded Filigree & Book Texture Styles (No harsh glows) */
      .filigree-gold-border {
        border: 1px solid rgba(200, 159, 75, 0.45);
        box-shadow: inset 0 0 10px rgba(184, 134, 11, 0.08);
      }
      .antique-frame {
        outline: 1.5px solid rgba(200, 159, 75, 0.6);
        outline-offset: -5px;
      }
      .clip-ribbon {
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), 50% 100%, 0 calc(100% - 6px));
      }
      .gold-gradient-text {
        background: linear-gradient(135deg, #b8860b 0%, #c89f4b 50%, #996515 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .brass-corner-tl {
        border-top: 2.5px solid #c89f4b;
        border-left: 2.5px solid #c89f4b;
      }
      .brass-corner-tr {
        border-top: 2.5px solid #c89f4b;
        border-right: 2.5px solid #c89f4b;
      }
      .brass-corner-bl {
        border-bottom: 2.5px solid #c89f4b;
        border-left: 2.5px solid #c89f4b;
      }
      .brass-corner-br {
        border-bottom: 2.5px solid #c89f4b;
        border-right: 2.5px solid #c89f4b;
      }
    </style>
